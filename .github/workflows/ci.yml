name: API Specimen - Continuous Integration

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  validation-and-tests:
    runs-on: ubuntu-latest

    steps:
      # 1. Descargar el código del repositorio
      - name: Checkout source code
        uses: actions/checkout@v4

      # 2. Configurar el entorno de Java 21 (Temurin)
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'
          cache-dependency-path: 'API_Specimen/pom.xml'

      # 3. Darle permisos de ejecución al Maven Wrapper
      - name: Grant execute permission for mvnw
        run: chmod +x mvnw
        working-directory: API_Specimen

      # 4. Compilar y ejecutar las pruebas unitarias aisladas con Mockito
      - name: Run Unit Tests with Maven
        run: ./mvnw clean test
        working-directory: API_Specimen

  # ================= FASE 3: DESPLIEGUE CONTINUO (CD) =================
  deploy-to-dockerhub:
    name: Build and Push Docker Image
    needs: validation-and-tests
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      # Iniciar sesión de forma segura usando la sintaxis correcta de un solo punto
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Configurar Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Construir y empujar la imagen
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./API_Specimen
          file: ./API_Specimen/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/api-specimen:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/api-specimen:${{ github.sha }}